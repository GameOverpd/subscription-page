<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--bg-primary:#0e1621;--bg-secondary:#17212b;--bg-tertiary:#1b2836;--bg-card:#1e2c3a;--bg-card-hover:#243447;--bg-card-active:#2b5278;--accent:#5288c1;--accent-light:#64b5ef;--accent-glow:rgba(82,136,193,0.25);--text-primary:#f5f5f5;--text-secondary:#8b9bab;--text-muted:#5d7084;--border:rgba(255,255,255,0.06);--success:#4fae4e;--warning:#e8a14c;--danger:#e05d44;--violet:#7b68ee;--cyan:#45bdc6;--teal:#2bb89d;--orange:#e8983e;--red:#e05d44;--radius:14px;--radius-sm:10px;--shadow:0 2px 12px rgba(0,0,0,0.3);--glow1:rgba(82,136,193,0.08);--glow2:rgba(123,104,238,0.06);--glow3:rgba(69,189,198,0.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;transition:background .5s}
.bg-pattern{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 20% 10%,var(--glow1) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 90%,var(--glow2) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 50% 50%,var(--glow3) 0%,transparent 60%);transition:background .5s}
.bg-dots{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:24px 24px}
.container{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:24px 16px 80px}
.header{display:flex;align-items:center;gap:14px;padding:20px 0 8px;margin-bottom:20px}
.header-logo{width:48px;height:48px;border-radius:12px;overflow:hidden;background:var(--bg-card);flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-logo img{width:100%;height:100%;object-fit:cover}
.header-info{flex:1}
.header-title{font-size:22px;font-weight:800;letter-spacing:-.3px}
.header-sub{font-size:13px;color:var(--text-secondary);margin-top:2px}
.header-actions{display:flex;gap:8px}
.btn-icon{width:40px;height:40px;border-radius:10px;border:none;background:var(--bg-card);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.btn-icon:hover{background:var(--bg-card-hover);color:var(--accent-light)}
.sub-info{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px;box-shadow:var(--shadow);transition:all .4s}
.sub-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.sub-row+.sub-row{border-top:1px solid var(--border)}
.sub-label{font-size:13px;color:var(--text-secondary)}
.sub-value{font-size:14px;font-weight:700}
.sub-value.active{color:var(--success)}
.bandwidth-bar{margin-top:10px;background:var(--bg-tertiary);border-radius:6px;height:8px;overflow:hidden;transition:background .4s}
.bandwidth-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-light));transition:all .5s}
.section-title{font-size:15px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;transition:color .4s}
.platforms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(119px,1fr));gap:8px;margin-bottom:24px}
.platform-card{background:var(--bg-secondary);border:1.5px solid var(--border);border-radius:8px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .25s ease;user-select:none;text-align:center}
.platform-card:hover{background:var(--bg-card-hover);border-color:rgba(82,136,193,.3);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.platform-card.active{background:var(--bg-card-active);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow),0 4px 16px rgba(0,0,0,.3)}
.platform-card .icon-wrap{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:color .3s}
.platform-card.active .icon-wrap{color:var(--accent-light)}
.platform-card .icon-wrap svg{width:20px;height:20px}
.platform-card .plat-name{font-size:11.5px;font-weight:700;line-height:1.2}
.apps-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.apps-tabs::-webkit-scrollbar{height:0}
.app-tab{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius-sm);background:var(--bg-secondary);border:1.5px solid var(--border);cursor:pointer;transition:all .2s;white-space:nowrap}
.app-tab:hover{background:var(--bg-card-hover)}
.app-tab.active{background:var(--bg-card-active);border-color:var(--accent)}
.app-tab .app-name{font-size:13px;font-weight:700}
.app-tab .featured-badge{font-size:10px;font-weight:700;background:var(--accent);color:#fff;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;transition:background .3s}
.incy-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:#9db86a;color:#1a2510;margin-left:4px;vertical-align:middle}
.steps-container{display:flex;flex-direction:column;gap:2px}
.step-card{background:var(--bg-secondary);border:1px solid var(--border);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;transition:all .4s}
.step-card:first-child{border-radius:var(--radius) var(--radius) 0 0}
.step-card:last-child{border-radius:0 0 var(--radius) var(--radius)}
.step-card:only-child{border-radius:var(--radius)}
.step-num{width:32px;height:32px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.step-num.violet{background:rgba(123,104,238,.15);color:var(--violet)}
.step-num.cyan{background:rgba(69,189,198,.15);color:var(--cyan)}
.step-num.teal{background:rgba(43,184,157,.15);color:var(--teal)}
.step-num.orange{background:rgba(232,152,62,.15);color:var(--orange)}
.step-num.red{background:rgba(224,93,68,.15);color:var(--red)}
.step-content{flex:1;min-width:0}
.step-title{font-size:15px;font-weight:700;margin-bottom:4px}
.step-desc{font-size:13px;color:var(--text-secondary);line-height:1.55}
.step-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.step-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none}
.step-btn.primary{background:var(--accent);color:#fff}
.step-btn.primary:hover{background:var(--accent-light)}
.step-btn.secondary{background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border)}
.step-btn.secondary:hover{background:var(--bg-card-hover)}
.step-btn svg{width:14px;height:14px}
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-secondary);border-radius:var(--radius);border:1px solid var(--border);padding:24px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.modal h3{font-size:18px;margin-bottom:16px}
.modal .link-box{background:var(--bg-tertiary);border-radius:8px;padding:12px;font-size:12px;color:var(--text-secondary);word-break:break-all;margin-bottom:14px;line-height:1.5;border:1px solid var(--border)}
.modal .btn-copy{width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.modal .btn-copy:hover{background:var(--accent-light)}
.modal .btn-close{width:100%;padding:10px;border:none;border-radius:8px;background:transparent;color:var(--text-secondary);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;z-index:200;pointer-events:none}
.toast.show{opacity:1}
.footer{text-align:center;padding:30px 0 10px;color:var(--text-muted);font-size:12px}
.footer a{color:var(--accent);text-decoration:none}
.footer a:hover{text-decoration:underline}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeUp .4s ease-out forwards}
.delay-1{animation-delay:.05s;opacity:0}
.delay-2{animation-delay:.1s;opacity:0}
.delay-3{animation-delay:.15s;opacity:0}
@media(max-width:480px){.platforms-grid{grid-template-columns:repeat(3,1fr)}.container{padding:16px 12px 60px}.header-title{font-size:18px}}
</style>

<script>
const LANG='ru';

// --- Parse real data from backend ---
let PANEL={}, SUB_LINK='';
try {
  const raw = atob(window.__PANEL_DATA__ || '');
  PANEL = JSON.parse(raw);
} catch(e) { console.warn('No panel data:', e); }

const panelResp = PANEL.response || {};
const userData = panelResp.user || {};
SUB_LINK = panelResp.subscriptionUrl || window.location.href;
const LP = SUB_LINK;

// Populate user info after DOM load
document.addEventListener('DOMContentLoaded', () => {
  const vals = document.querySelectorAll('.sub-value');

  // Username
  if (vals[0]) vals[0].textContent = userData.username || userData.shortUuid || '—';

  // Status — check multiple possible field names, then infer
  if (vals[1]) {
    const st = (userData.status || userData.userStatus || '').toUpperCase();
    const enabled = userData.enabled !== false && userData.isDisabled !== true;
    const daysLeft = userData.daysLeft;

    let isActive = false;
    let statusText = '—';

    if (st) {
      isActive = st === 'ACTIVE';
      if (st === 'ACTIVE') statusText = 'Активна';
      else if (st === 'EXPIRED') statusText = 'Истекла';
      else if (st === 'DISABLED') statusText = 'Отключена';
      else if (st === 'LIMITED') statusText = 'Лимит исчерпан';
      else statusText = st;
    } else {
      // Infer from daysLeft and enabled
      isActive = enabled && (daysLeft == null || daysLeft > 0);
      statusText = isActive ? 'Активна' : 'Неактивна';
    }

    vals[1].textContent = statusText;
    vals[1].className = 'sub-value ' + (isActive ? 'active' : '');
    if (!isActive) vals[1].style.color = 'var(--danger)';
  }

  // Expiry (field can be expiresAt or expireAt)
  if (vals[2]) {
    const daysLeft = userData.daysLeft;
    const expiry = userData.expiresAt || userData.expireAt;
    if (expiry) {
      const d = new Date(expiry);
      const dateStr = d.toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'});
      vals[2].textContent = daysLeft != null ? dateStr + ' (' + daysLeft + ' дн.)' : dateStr;
    } else if (daysLeft != null) {
      vals[2].textContent = daysLeft + ' дн. осталось';
    } else {
      vals[2].textContent = 'Бессрочно';
    }
  }

  // Bandwidth — trafficLimit "0" means unlimited
  if (vals[3]) {
    const used = userData.trafficUsed || '';
    const limit = userData.trafficLimit || '';
    const isUnlimited = !limit || limit === '0' || limit === '0 B';

    if (used && !isUnlimited) {
      vals[3].textContent = used + ' / ' + limit;
    } else if (used) {
      vals[3].textContent = used + ' / ∞';
    } else {
      vals[3].textContent = '—';
    }

    // Progress bar
    const fill = document.querySelector('.bandwidth-fill');
    const usedBytes = Number(userData.trafficUsedBytes) || 0;
    const limitBytes = Number(userData.trafficLimitBytes) || 0;
    if (fill && limitBytes > 0) {
      fill.style.width = Math.min(100, (usedBytes / limitBytes) * 100).toFixed(1) + '%';
    } else if (fill) {
      fill.style.width = '0%';
    }
  }

  // Update link modal
  const linkBox = document.getElementById('subLinkBox');
  if (linkBox) linkBox.textContent = SUB_LINK;

  // Fetch branding config from backend
  fetch('/assets/.app-config-v2.json?v=' + Date.now(), {credentials:'same-origin'})
    .then(r => r.json())
    .then(cfg => {
      // Branding
      const brand = cfg.brandingSettings || {};
      if (brand.title) {
        const titleEl = document.querySelector('.header-title');
        if (titleEl) titleEl.textContent = brand.title;
      }
      if (brand.logoUrl) {
        const logoImg = document.querySelector('.header-logo img');
        if (logoImg) { logoImg.src = brand.logoUrl; logoImg.style.display = ''; }
      }
      if (brand.supportUrl) {
        const supportBtn = document.querySelector('.header-actions a.btn-icon');
        if (supportBtn) supportBtn.href = brand.supportUrl;
      }
      // Meta
      const base = cfg.baseSettings || {};
      if (base.metaTitle) document.title = base.metaTitle;
    })
    .catch(e => console.warn('Config fetch failed:', e));
});
